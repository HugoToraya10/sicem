<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SICEM — Portal hospitalario</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Tema visual guardado (skin): se aplica antes del primer pintado.
      try { var sk = localStorage.getItem('sicem_skin'); if (sk && sk !== 'clasico') document.documentElement.dataset.skin = sk } catch (e) {}
      // Aplica el tema guardado antes del primer pintado, para que no parpadee.
      try { if (localStorage.getItem('sicem_theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
